{% extends "base.html" %}
{% block title %}Registrar conta{% endblock %}
{% block content %}
  <h1>Registrar conta</h1>
  <p class="muted">Preencha e envie. O formulario fica pronto para o proximo lancamento em seguida.</p>

  <form method="post" class="form-lancamento" autocomplete="off">
    <div class="field">
      <label for="pessoa">Pessoa</label>
      <input list="lista-pessoas" id="pessoa" name="pessoa" required autofocus placeholder="Nome da pessoa">
      <datalist id="lista-pessoas">
        {% for p in pessoas %}<option value="{{ p.nome }}">{% endfor %}
      </datalist>
    </div>

    <div class="field">
      <label for="produto_id">Produto</label>
      <select id="produto_id" name="produto_id" required>
        <option value="">Selecione...</option>
        {% for prod in produtos %}
        <option value="{{ prod.id }}" data-preco="{{ prod.preco }}">
          {{ prod.numero_item }} - {{ prod.nome }} (R$ {{ "%.2f"|format(prod.preco) }})
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="quantidade">Quantidade</label>
        <input type="number" id="quantidade" name="quantidade" value="1" min="1" step="1" required>
      </div>
      <div class="field">
        <label>Valor total</label>
        <output id="valor-total" class="valor-preview">R$ 0,00</output>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="forma_pagamento">Forma de pagamento</label>
        <select id="forma_pagamento" name="forma_pagamento">
          {% for f in formas %}<option value="{{ f }}">{{ f }}</option>{% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="data">Data</label>
        <input type="date" id="data" name="data" value="{{ hoje }}">
      </div>
    </div>

    <div class="field field-checkbox">
      <label><input type="checkbox" id="pago" name="pago"> Ja foi pago no ato</label>
    </div>

    <div class="field">
      <label for="observacoes">Observacoes (opcional)</label>
      <input type="text" id="observacoes" name="observacoes" placeholder="Ex: pagou parcial, combinou para sexta...">
    </div>

    <button type="submit" class="btn btn-primary">Registrar</button>
  </form>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}
