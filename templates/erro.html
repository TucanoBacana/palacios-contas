{% extends "base.html" %}
{% from "_ui.html" import icon %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
  <div class="tela-erro">
    {{ icon('search-off' if codigo == 404 else 'alert') }}
    <h1>{{ titulo }}</h1>
    <p>{{ mensagem }}</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primario btn-grande">Voltar ao Painel</a>
  </div>
{% endblock %}
