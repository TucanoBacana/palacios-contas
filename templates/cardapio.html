{% extends "base.html" %}
{% block title %}Cardapio{% endblock %}
{% block content %}
  <h1>Cardapio</h1>

  <table>
    <thead><tr><th>N. Item</th><th>Produto</th><th>Preco</th><th></th></tr></thead>
    <tbody>
      {% for prod in produtos %}
      <tr>
        <td>{{ prod.numero_item }}</td>
        <td>{{ prod.nome }}</td>
        <td>
          <form method="post" class="inline-form">
            <input type="hidden" name="acao" value="editar">
            <input type="hidden" name="produto_id" value="{{ prod.id }}">
            <input type="number" step="0.01" name="preco" value="{{ prod.preco }}" class="preco-input">
            <button type="submit" class="btn btn-sm">Salvar</button>
          </form>
        </td>
        <td>
          <form method="post" class="inline-form" onsubmit="return confirm('Remover este produto do cardapio?');">
            <input type="hidden" name="acao" value="desativar">
            <input type="hidden" name="produto_id" value="{{ prod.id }}">
            <button type="submit" class="btn btn-sm btn-danger">Remover</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <h2>Adicionar produto</h2>
  <form method="post" class="form-lancamento">
    <input type="hidden" name="acao" value="novo">
    <div class="field-row">
      <div class="field">
        <label for="numero_item">N. Item</label>
        <input type="number" id="numero_item" name="numero_item" required>
      </div>
      <div class="field">
        <label for="nome">Produto</label>
        <input type="text" id="nome" name="nome" required>
      </div>
      <div class="field">
        <label for="preco">Preco</label>
        <input type="number" step="0.01" id="preco" name="preco" required>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Adicionar</button>
  </form>
{% endblock %}
